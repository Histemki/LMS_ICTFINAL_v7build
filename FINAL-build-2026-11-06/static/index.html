<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astana IT University LMS</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<style>
:root {
    --bg: #d4d5d9;
    --side: #cfcfcf;
    --main: #bebebe;
    --card: #d9d9d9;
    --strip: #cdcdcd;
    --text: #111;
    --rail: #202020;
    --sh: 0 3px 6px #0004;
    --ok: #08501f;
    --err: #7a1c10;
}
:root[data-theme=dark] {
    --bg: #16171a;
    --side: #26272b;
    --main: #1d1e21;
    --card: #34353a;
    --strip: #2b2c30;
    --text: #eee;
    --rail: #000;
    --sh: 0 3px 6px #0008;
    --ok: #5ee38b;
    --err: #ff8a80;
}
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Inter,system-ui,sans-serif;
    background: var(--bg);
    color: var(--text);
}
button,input,select,textarea {
    font: inherit;
    color: var(--text);
    min-height: 44px;
    min-width: 44px;
    border-radius: 10px;
    border: 1px solid #8886;
    padding: 0 12px;
    background: var(--card);
}
button {
    cursor: pointer;
}
#login {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 16px;
    background: linear-gradient(135deg,#27406b,#111);
}
.logo {
    width: 96px;
    max-width: 70%;
    height: auto;
}
.lbox {
    background: #e2e2e2;
    border: 1px solid #fff6;
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    min-height: 210px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
}
.ms {
    background: #1f1f1f;
    color: #fff;
    border: 0;
    width: 100%;
    max-width: 374px;
    box-shadow: 0 8px 14px #0005;
    display: flex;
    align-items: center;
    gap: 22px;
    text-align: left;
}
.ms:hover {
    background: #000;
}
#email,#password {
    width: 100%;
    max-width: 374px;
    background: #fff;
    color: #111;
}
.pw {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 374px;
}
.pw #password {
    flex: 1;
    min-width: 0;
}
#showpw {
    background: #fff;
    color: #111;
    font-size: 13px;
}
.msg {
    color: var(--err);
    min-height: 20px;
    font-size: 14px;
}
#app {
    display: none;
    min-height: 100vh;
    padding: 14px;
    gap: 14px;
    grid-template-columns: 80px 300px 1fr;
}
.leftcol {
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.rail {
    background: var(--rail);
    border-radius: 14px;
    padding: 14px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: var(--sh);
}
.rail button {
    background: transparent;
    border: 0;
    color: #fff;
    font-size: 22px;
    border-radius: 10px;
}
.ico {
    width: 26px;
    height: 26px;
    flex: none;
    fill: none;
    stroke: currentColor;      /* follows the text colour, so light/dark theme needs no image tricks */
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
}
.rail button.on {
    background: #555;
}
.tools {
    flex: 1;
    min-height: 80px;
    background: var(--side);
    border-radius: 14px;
    box-shadow: var(--sh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 8px;
    gap: 6px;
}
.tools button {
    background: transparent;
    border: 0;
    font-size: 20px;
}
.side {
    background: var(--side);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--sh);
    position: relative;
}
.user {
    width: 100%;
    text-align: left;
    background: var(--card);
    box-shadow: var(--sh);
    border: 0;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 6px 12px;
    font-size: 13px;
    height: auto;
    min-height: 56px;
}
.user span {
    font-size: 24px;
}
#lo {
    display: none;
    width: 100%;
    margin-top: 2px;
    background: var(--strip);
    border: 0;
    box-shadow: var(--sh);
}
.menu {
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.menu button {
    text-align: left;
    border: 0;
    background: transparent;
    font-size: 17px;
    display: flex;
    gap: 14px;
    align-items: center;
}
.menu button.on {
    background: var(--card);
    box-shadow: var(--sh);
    border: 1px solid #fff5;
}
main {
    background: var(--main);
    border-radius: 14px;
    padding: 28px;
    box-shadow: inset 0 0 0 3px #ffffff30;
    overflow-x: auto;
}
h2 {
    margin-top: 0;
}
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(210px,1fr));
    gap: 34px 40px;
}
.card {
    position: relative;
    padding-bottom: 36px;
}
.card .top {
    background: var(--card);
    border-radius: 10px;
    padding: 16px;
    min-height: 110px;
    box-shadow: var(--sh);
    position: relative;
    z-index: 1;
}
.card .strip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 72px;
    background: var(--strip);
    border-radius: 10px;
    padding: 46px 12px 0;
    font-size: 13px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
td,th {
    padding: 10px;
    border-bottom: 1px solid #8886;
    text-align: left;
}
.bar {
    height: 8px;
    background: #8884;
    border-radius: 4px;
    min-width: 80px;
}
.bar i {
    display: block;
    height: 100%;
    background: #202020;
    border-radius: 4px;
}
:root[data-theme=dark] .bar i {
    background: #ddd;
}
form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
}
.big {
    font-size: 34px;
    font-weight: 700;
}
.tl-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
}
.tl-controls input {
    flex: 1;
    min-width: 200px;
}
.tl-day {
    font-weight: 700;
    margin: 22px 0 6px;
}
.tl-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    padding: 10px 14px;
    border-bottom: 1px solid #8886;
}
.tl-time {
    width: 44px;
    flex: none;
    font-size: 14px;
}
.tl-ico {
    width: 30px;
    height: 30px;
}
.tl-body {
    min-width: 0;
}
.badge {
    display: inline-block;
    background: #555;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 12px;
    padding: 2px 9px;
    margin-left: 6px;
}
.badge.od {
    background: #c0392b;
}
#more {
    margin-top: 14px;
}
@media(max-width:760px) {
    #app {
        grid-template-columns: minmax(0,1fr);   /* plain 1fr let the nowrap menu stretch the page to 604px at 360px */
        padding: 8px;
    }
    .leftcol, .side, main {
        min-width: 0;
    }
    .leftcol {
        flex-direction: row;
    }
    .rail {
        flex-direction: row;
        flex: 1;
        padding: 6px 10px;
        justify-content: space-around;
    }
    .tools {
        flex: 0 0 auto;
        min-height: 0;
        flex-direction: row;
        padding: 4px;
    }
    .menu {
        margin-top: 12px;
        flex-direction: row;
        overflow-x: auto;
        gap: 6px;
    }
    .menu button {
        white-space: nowrap;
        font-size: 15px;
        flex: none;          /* do not squash the buttons: the row scrolls inside .menu instead of overlapping */
    }
    main {
        padding: 16px;
    }
    .cards {
        gap: 26px 16px;
    }
}

.cover {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 10px;
}
.msg.ok {
    color: var(--ok);
}
.msg:not(:empty) {
    animation: pop .35s ease-out;
}
@keyframes pop {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
}
.sk .top, .sk .strip {
    background: linear-gradient(90deg,var(--card) 25%,var(--strip) 50%,var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s linear infinite;
}
.sk .top { min-height: 200px; }
@keyframes shimmer {
    to { background-position: -200% 0; }
}
@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

body[data-role=student] [data-r=t], body[data-role=student] [data-r=a],
body[data-role=teacher] [data-r=s], body[data-role=teacher] [data-r=a], body[data-role=teacher] [data-r=sa],
body[data-role=admin] [data-r=s], body[data-role=admin] [data-r=t], body[data-role=admin] [data-r=st],
body[data-role=student] [data-r=ad], body[data-role=teacher] [data-r=ad] { display: none !important; }
.badge.ok { background: #1e7a3c; }
td .row input { flex: 1 1 160px; min-width: 120px; }
textarea { min-height: 64px; padding: 10px 12px; resize: vertical; }
form.lab { align-items: flex-end; }
.f { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }

.role { font-size: 11px; font-weight: 700; opacity: .75; text-transform: uppercase; letter-spacing: .04em; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row select { flex: 1; min-width: 0; }
.gboxes { display: grid; grid-template-columns: repeat(auto-fill,minmax(270px,1fr)); gap: 20px; }
.gbox { background: var(--card); border-radius: 10px; padding: 16px; box-shadow: var(--sh); display: flex; flex-direction: column; gap: 10px; min-width: 0; }

button:disabled, select:disabled { opacity: .5; cursor: not-allowed; }

      <span class="menu-label">Administration</span>
      <button data-v="devices" data-r="a"><svg class="ico" aria-hidden="true" focusable="false"><use href="icons/sprite.svg?v=6#i-radio"/></svg>Check-in readers</button>
      <button data-v="course-admin" data-r="ad"><svg class="ico" aria-hidden="true" focusable="false"><use href="icons/sprite.svg?v=6#i-settings"/></svg>Courses &amp; schedule</button>
      <button data-v="support" data-r="ad"><svg class="ico" aria-hidden="true" focusable="false"><use href="icons/sprite.svg?v=6#i-support"/></svg>Support requests</button>
    </nav>
  </div>
  <main id="view"></main>
</div>

<script>
const $=s=>document.querySelector(s);
const BASE=location.port==="5000"?"":"http://127.0.0.1:5000";
let token=sessionStorage.getItem("t")||"";
{ // a scanned check-in QR code opens  /?checkin=<code>  : keep the code until the student is signed in
  const q=new URLSearchParams(location.search).get("checkin");
  if(q){sessionStorage.setItem("pc",q);history.replaceState(null,"",location.pathname)}
}
async function api(path,opt={}){
  const url=BASE+"/api"+path;
  const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",Authorization:token}});
  let d={};try{d=await r.json()}catch(e){throw new Error("Server error "+r.status+" - open http://127.0.0.1:5000 (run python app_postgresql.py)")}
  if(r.status===401&&path!=="/login"){sessionStorage.clear();token="";if(announcementCountTimer)clearInterval(announcementCountTimer);$("#app").style.display="none";$("#login").style.display="flex"}
  if(!r.ok)throw new Error(r.status===405?`${opt.method||"GET"} ${url}: ${d.error||"Method not allowed"}`:d.error||"Error");return d;
}                                                                                                                                                         
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mask=e=>e.replace(/^(\d\d)\d+@/,"$1*****@");

$("#signin").onclick=async()=>{
  try{const d=await api("/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#password").value})});
    $("#password").value="";$("#lmsg").textContent="";
    token=d.token;sessionStorage.setItem("t",token);sessionStorage.setItem("n",d.name);sessionStorage.setItem("m",d.email);sessionStorage.setItem("r",d.role);start();}
  catch(e){$("#password").value="";$("#lmsg").textContent=e.message}
};
["#email","#password"].forEach(s=>$(s).addEventListener("keydown",e=>{if(e.key==="Enter")$("#signin").click()}));
$("#showpw").onclick=()=>{const p=$("#password"),h=p.type==="password";p.type=h?"text":"password";$("#showpw").textContent=h?"Hide":"Show"};
$("#user").onclick=()=>{const o=$("#lo").style.display==="block";$("#lo").style.display=o?"none":"block";
  $("#umail").textContent=mask(sessionStorage.getItem("m")||"")+(o?" \u25BE":" \u25B4")};
$("#lo").onclick=async()=>{try{await api("/logout",{method:"POST"})}catch(e){}sessionStorage.clear();token="";if(announcementCountTimer)clearInterval(announcementCountTimer);$("#app").style.display="none";$("#login").style.display="flex"};
let sound=true;
const ping=()=>{if(!sound)return;try{const a=new Audio("media/notify.mp3");a.volume=.5;a.play().catch(()=>{})}catch(e){}};
$("#snd").onclick=()=>{sound=!sound;$("#snd").setAttribute("aria-pressed",sound);$("#snd").title=sound?"Sound on":"Sound off"};   // icon swap is done in CSS from aria-pressed
$("#theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"":"dark"};
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>show(b.dataset.v));

function start(){announcementReadIds.clear();const R=sessionStorage.getItem("r");document.body.dataset.role=R==="teacher"||R==="admin"?R:"student";   // no "r" saved = student
  $("#urole").textContent={teacher:"Teacher",admin:"Admin"}[document.body.dataset.role]||"Student";$("#login").style.display="none";$("#app").style.display="grid";
  $("#uname").textContent=sessionStorage.getItem("n");$("#umail").textContent=mask(sessionStorage.getItem("m"))+" \u25BE";show(document.body.dataset.role==="admin"?"course-admin":sessionStorage.getItem("pc")&&document.body.dataset.role==="student"?"checkin":"courses");updateAnnouncementCount();if(announcementCountTimer)clearInterval(announcementCountTimer);announcementCountTimer=setInterval(updateAnnouncementCount,60000)}

const card=(t,s)=>`<div class=card><div class=top>${t}</div><div class=strip>${s}</div></div>`;
const cover=(id,i)=>{const n=id%5;   // first two covers are above the fold -> eager, the rest lazy
  return `<img class=cover src="media/cover-${n}-640.webp" srcset="media/cover-${n}-320.webp 320w, media/cover-${n}-640.webp 640w" sizes="(max-width:600px) 90vw, 240px" width=320 height=180 alt="" ${i<2?"":"loading=lazy "}decoding=async>`};
const bar=p=>`<div class=bar><i style="width:${p}%"></i></div>`;

const T=()=>document.body.dataset.role==="teacher";
const WD=["","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const fmtDate=s=>new Date(s+"T00:00:00Z").toLocaleDateString("en-GB",{timeZone:"UTC",weekday:"short",day:"numeric",month:"short",year:"numeric"});
const left=s=>{const a=Math.abs(s),d=Math.floor(a/86400),h=Math.floor(a%86400/3600),m=Math.floor(a%3600/60);
  const t=d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`;return s<0?`overdue by ${t}`:`${t} left`};
const note=(ok,txt)=>{const m=$("#note");if(!m)return;m.className="msg"+(ok?" ok":"");m.textContent=txt};
const opts=(list,val,name)=>list.map(x=>`<option value=${x[val]}>${esc(name(x))}</option>`).join("");

let announcementCountTimer=null,announcementObserver=null,announcementSearchTimer=null,announcementReloadPending=false;const announcementReadIds=new Set();
async function updateAnnouncementCount(){
  const button=$("#announcement-nav"),badge=$("#announcement-unread-badge");if(!button||!token)return;
  try{const d=await api("/announcements/unread-count");const n=Number(d.count)||0;badge.textContent=n?(n>9?"9+":String(n)):"";button.title="Announcements";button.setAttribute("aria-label",n?`Announcements, ${n} unread`:"Announcements")}catch(e){}
}
function announcementBody(text){return String(text).split(/(https?:\/\/[^\s<>]+)/gi).map(part=>/^https?:\/\//i.test(part)?`<a href="${esc(part)}" target="_blank" rel="noopener noreferrer">${esc(part)}</a>`:esc(part)).join("").replace(/\n/g,"<br>")}
function announcementCard(a,admin=false,compact=false){
  const unread=!a.is_read&&!announcementReadIds.has(Number(a.id));return `<article class="announcement-card" data-announcement-id="${Number(a.id)}"><div class="announcement-labels">${a.pinned?'<span class="badge announcement-pin">Pinned</span>':""}${unread?'<span class="badge announcement-new">New</span>':""}${admin&&a.expired?'<span class="badge announcement-expired">Expired</span>':""}<span class="badge">${esc(a.category)}</span></div><h3>${esc(a.title)}</h3><p>${announcementBody(a.body)}</p><div class="announcement-meta"><span>${esc(a.created_at||"")}</span><span>By ${esc(a.author||"")}</span>${a.course?`<span>${esc(a.course)}</span>`:""}${a.updated_at?'<span>Edited</span>':""}</div>${!compact?`<div class="announcement-actions">${unread?`<button type="button" data-ann-read="${Number(a.id)}">Mark as read</button>`:""}${admin?`<button type="button" data-ann-edit="${Number(a.id)}">Edit</button><button type="button" data-ann-delete="${Number(a.id)}">Delete</button>`:""}</div>`:""}</article>`
}
function observeAnnouncementCards(root){
  if(announcementObserver)announcementObserver.disconnect();
  if(!("IntersectionObserver" in window))return;
  announcementObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){const card=entry.target;announcementObserver.unobserve(card);if(card.querySelector(".announcement-new"))markAnnouncementRead(card.dataset.announcementId,card)}}),{threshold:.2});
  root.querySelectorAll(".announcement-card[data-announcement-id]").forEach(card=>{if(card.querySelector(".announcement-new"))announcementObserver.observe(card)});
}
async function markAnnouncementRead(id,card){try{await api(`/announcements/${id}/read`,{method:"POST"});announcementReadIds.add(Number(id));card?.querySelector(".announcement-new")?.remove();card?.querySelector(`[data-ann-read="${id}"]`)?.remove();await updateAnnouncementCount()}catch(e){}}
async function showAnnouncements(){
  const el=$("#view"),admin=document.body.dataset.role==="admin";let offset=0,items=[],busy=false,hasMore=true;
  el.innerHTML=`<h2>Announcements</h2><div class="msg" id="ann-error" aria-live="polite"></div>${admin?'<button id="ann-new" type="button">New announcement</button>':""}<div id="ann-editor"></div><div class="announcement-toolbar"><label class="sr-only" for="ann-search">Search announcements</label><input id="ann-search" placeholder="Search announcements" aria-label="Search announcements"><label class="sr-only" for="ann-category">Category</label><select id="ann-category" aria-label="Filter by category"><option value="">All categories</option><option>General</option><option>Important</option><option>Exams</option><option>Events</option></select><button id="ann-read-all" type="button">Mark all as read</button></div><div id="ann-list" class="announcement-list" aria-live="polite"></div><button id="ann-more" type="button" style="display:none">Show more</button>`;
  const list=$("#ann-list"),error=$("#ann-error"),more=$("#ann-more");let courses=[];
  if(admin){try{courses=await api("/announcements/courses")}catch(e){error.textContent=e.message}}
  const editor=$("#ann-editor");
  const editForm=(a=null)=>{const today=new Date().toLocaleDateString("sv-SE");editor.innerHTML=`<form id="announcement-form" class="announcement-form" novalidate><h3 class="full">${a?"Edit announcement":"New announcement"}</h3><label class="full">Title<input id="ann-title" maxlength="120" required value="${esc(a?.title||"")}"></label><label class="full">Text<textarea id="ann-body" maxlength="2000" required aria-describedby="ann-body-count">${esc(a?.body||"")}</textarea><small id="ann-body-count">${(a?.body||"").length}/2000</small></label><label>Category<select id="ann-cat">${["General","Important","Exams","Events"].map(x=>`<option ${a?.category===x?"selected":""}>${x}</option>`).join("")}</select></label><label>Audience<select id="ann-audience"><option value="everyone" ${!a||a.audience==="everyone"?"selected":""}>Everyone</option><option value="students" ${a?.audience==="students"?"selected":""}>Students</option><option value="teachers" ${a?.audience==="teachers"?"selected":""}>Teachers</option><option value="course" ${a?.audience==="course"?"selected":""}>Specific course</option></select></label><label id="ann-course-wrap" style="display:none">Course<select id="ann-course">${courses.map(c=>`<option value="${c.id}" ${a?.course_id===c.id?"selected":""}>${esc(c.title)} (${esc(c.code)})</option>`).join("")}</select></label><label>Show until (optional)<input id="ann-expires" type="date" min="${today}" value="${esc(a?.expires_at||"")}"></label><label class="full pin-label"><span><input id="ann-pinned" type="checkbox" style="width:20px;min-width:20px;min-height:20px;vertical-align:middle" ${a?.pinned?"checked":""}> Pin to top</span></label><div class="form-error" id="ann-form-error" aria-live="polite"></div><div class="form-actions"><button type="submit">${a?"Save changes":"Publish announcement"}</button><button type="button" id="ann-cancel">Cancel</button></div></form>`;
    const form=$("#announcement-form"),aud=$("#ann-audience"),wrap=$("#ann-course-wrap"),body=$("#ann-body");const toggle=()=>wrap.style.display=aud.value==="course"?"flex":"none";toggle();aud.onchange=toggle;body.oninput=()=>$("#ann-body-count").textContent=`${body.value.length}/2000`;$("#ann-cancel").onclick=()=>editor.replaceChildren();$("#ann-title").focus();form.onsubmit=async e=>{e.preventDefault();const err=$("#ann-form-error"),payload={title:$("#ann-title").value,body:body.value,category:$("#ann-cat").value,audience:aud.value,course_id:aud.value==="course"?$("#ann-course").value:null,pinned:$("#ann-pinned").checked,expires_at:$("#ann-expires").value||null};try{await api(a?`/announcements/${a.id}`:"/announcements",{method:a?"PUT":"POST",body:JSON.stringify(payload)});editor.replaceChildren();await load(true)}catch(ex){err.textContent=ex.message}};
  };
  const draw=()=>{list.innerHTML=items.map(x=>announcementCard(x,admin)).join("")||(!busy?"<p>No announcements yet.</p>":"");more.style.display=hasMore?"inline-block":"none";observeAnnouncementCards(list);wireCards()};
  const load=async reset=>{if(busy){announcementReloadPending=announcementReloadPending||reset;return}busy=true;error.textContent="";if(reset){offset=0;items=[];hasMore=true}try{const q=$("#ann-search").value.trim(),category=$("#ann-category").value,params=new URLSearchParams({offset:String(offset),limit:"10"});if(q)params.set("q",q);if(category)params.set("category",category);const page=await api("/announcements?"+params.toString());items=reset?page:items.concat(page);offset+=page.length;hasMore=page.length===10;draw();await updateAnnouncementCount()}catch(e){error.innerHTML=`${esc(e.message)} <button type="button" id="ann-retry">Try again</button>`;$("#ann-retry").onclick=()=>load(reset)}finally{busy=false;if(announcementReloadPending){announcementReloadPending=false;load(true)}}};
  function wireCards(){list.querySelectorAll("[data-ann-read]").forEach(b=>b.onclick=()=>markAnnouncementRead(b.dataset.annRead,b.closest(".announcement-card")));list.querySelectorAll("[data-ann-edit]").forEach(b=>b.onclick=()=>{const a=items.find(x=>x.id===Number(b.dataset.annEdit));if(a)editForm(a)});list.querySelectorAll("[data-ann-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this announcement? This cannot be undone."))return;try{await api(`/announcements/${b.dataset.annDelete}`,{method:"DELETE"});await load(true)}catch(e){error.textContent=e.message}})}
  $("#ann-read-all").onclick=async()=>{try{await api("/announcements/read-all",{method:"POST"});items.forEach(x=>{x.is_read=true;announcementReadIds.add(Number(x.id))});draw();await updateAnnouncementCount()}catch(e){error.textContent=e.message}};
  if(admin)$("#ann-new").onclick=()=>editForm();$("#ann-category").onchange=()=>load(true);$("#ann-search").oninput=()=>{clearTimeout(announcementSearchTimer);announcementSearchTimer=setTimeout(()=>load(true),250)};more.onclick=()=>load(false);await load(true);
}

async function showCourseAdmin(){
  const el=$("#view");
  el.innerHTML='<h2>Courses &amp; schedule</h2><p>Loading administration…</p>';
  try{
    const [courses,teachers,lessons]=await Promise.all([api('/admin/courses'),api('/admin/teachers'),api('/admin/schedule')]);
    if(!document.querySelector('[data-v="course-admin"].on'))return;
    let editing=null,lessonEditing=null;
    const teacherOpts=(selected=[])=>teachers.map(x=>`<option value="${x.id}" ${selected.includes(x.id)?'selected':''}>${esc(x.name)} (${esc(x.email)})</option>`).join('');
    const draw=()=>{
      const rows=courses.map(c=>`<article class="admin-course"><div><b>${esc(c.title)}</b> <span class="badge">${esc(c.code)}</span><p>${esc(c.description||'')}</p><small>Teachers: ${esc(c.teachers||'—')}</small></div><div class="admin-actions"><button type="button" data-course-edit="${c.id}">Edit</button><button type="button" data-course-delete="${c.id}">Delete</button></div></article>`).join('')||'<p>No courses yet.</p>';
      const schedule=lessons.map(x=>`<article class="admin-course"><div><b>${esc(x.class_date)} · ${esc(x.starts)}–${esc(x.ends)}</b><p>${esc(x.course)} (${esc(x.code)}) · ${esc(x.kind)} · Room ${esc(x.room)}</p><small>${esc(x.teachers)}</small></div><div class="admin-actions"><button type="button" data-lesson-edit="${x.id}">Edit</button><button type="button" data-lesson-delete="${x.id}">Cancel</button></div></article>`).join('')||'<p>No dated lessons yet.</p>';
      el.innerHTML=`<h2>Courses &amp; schedule</h2><div class="msg" id="admin-msg" role="status" aria-live="polite"></div><section class="admin-section"><h3>${editing?'Edit course':'Create course'}</h3><form id="course-form" class="admin-form"><label>Course code<input id="course-code" maxlength="20" required value="${esc(editing?.code||'')}"></label><label>Course title<input id="course-title" maxlength="150" required value="${esc(editing?.title||'')}"></label><label class="wide">Description<textarea id="course-description" maxlength="4000">${esc(editing?.description||'')}</textarea></label><label class="wide">Teachers <small>Choose one or more</small><select id="course-teachers" multiple required>${teacherOpts(editing?.teacher_ids||[])}</select></label><div class="admin-actions wide"><button type="submit">${editing?'Save course':'Create course'}</button>${editing?'<button type="button" id="course-cancel">Cancel edit</button>':''}</div></form></section><section class="admin-section"><h3>Courses</h3>${rows}</section><section class="admin-section"><h3>${lessonEditing?'Edit lesson':'Add a lesson'}</h3><form id="lesson-form" class="admin-form"><label>Course<select id="lesson-course" required>${courses.map(c=>`<option value="${c.id}" ${lessonEditing?.course_id===c.id?'selected':''}>${esc(c.title)} (${esc(c.code)})</option>`).join('')}</select></label><label>Date<input id="lesson-date" type="date" required value="${esc(lessonEditing?.class_date||'')}"></label><label>Start<input id="lesson-start" type="time" required value="${esc(lessonEditing?.starts||'09:00')}"></label><label>End<input id="lesson-end" type="time" required value="${esc(lessonEditing?.ends||'10:30')}"></label><label>Room<input id="lesson-room" maxlength="20" required value="${esc(lessonEditing?.room||'')}"></label><label>Type<select id="lesson-kind">${['Lecture','Practice','Lab'].map(k=>`<option ${lessonEditing?.kind===k?'selected':''}>${k}</option>`).join('')}</select></label><div class="admin-actions wide"><button type="submit">${lessonEditing?'Save lesson':'Add lesson'}</button>${lessonEditing?'<button type="button" id="lesson-cancel">Cancel edit</button>':''}</div></form></section><section class="admin-section"><h3>Scheduled lessons</h3>${schedule}</section>`;
      const msg=(text,ok=false)=>{const n=$('#admin-msg');if(n){n.textContent=text;n.className='msg'+(ok?' ok':'')}};
      $('#course-form').onsubmit=async e=>{e.preventDefault();const payload={code:$('#course-code').value,title:$('#course-title').value,description:$('#course-description').value,teacher_ids:[...$('#course-teachers').selectedOptions].map(o=>o.value)};try{await api(editing?`/admin/courses/${editing.id}`:'/admin/courses',{method:editing?'PUT':'POST',body:JSON.stringify(payload)});await showCourseAdmin()}catch(ex){msg(ex.message)}};
      $('#course-cancel')?.addEventListener('click',()=>{editing=null;draw()});$('#lesson-cancel')?.addEventListener('click',()=>{lessonEditing=null;draw()});
      el.querySelectorAll('[data-course-edit]').forEach(b=>b.onclick=()=>{editing=courses.find(x=>x.id===Number(b.dataset.courseEdit));lessonEditing=null;draw()});
      el.querySelectorAll('[data-course-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this course and its related records?'))return;try{await api(`/admin/courses/${b.dataset.courseDelete}`,{method:'DELETE'});await showCourseAdmin()}catch(ex){msg(ex.message)}});
      $('#lesson-form').onsubmit=async e=>{e.preventDefault();const payload={course_id:$('#lesson-course').value,class_date:$('#lesson-date').value,start:$('#lesson-start').value,end:$('#lesson-end').value,room:$('#lesson-room').value,kind:$('#lesson-kind').value};try{await api(lessonEditing?`/admin/schedule/${lessonEditing.id}`:'/admin/schedule',{method:lessonEditing?'PUT':'POST',body:JSON.stringify(payload)});await showCourseAdmin()}catch(ex){msg(ex.message)}};
      el.querySelectorAll('[data-lesson-edit]').forEach(b=>b.onclick=()=>{lessonEditing=lessons.find(x=>x.id===Number(b.dataset.lessonEdit));editing=null;draw()});
      el.querySelectorAll('[data-lesson-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Cancel this lesson?'))return;try{await api(`/admin/schedule/${b.dataset.lessonDelete}`,{method:'DELETE'});await showCourseAdmin()}catch(ex){msg(ex.message)}});
    };
    draw();
  }catch(ex){if(document.querySelector('[data-v="course-admin"].on'))el.innerHTML=`<h2>Courses &amp; schedule</h2><p class="msg">${esc(ex.message)}</p>`}
}

// ---- Media: links to videos / resources per course. Student reads, teacher (own courses) and admin (all) add / remove.
//      A card in "My courses" sets mediaFocus and opens this page filtered to that course.
let mediaFocus=null,gradeFocus=null;   // gradeFocus: {course,task} set by the "Grade" button of a teacher's assignment
const PLAYER_HOSTS=["https://www.youtube-nocookie.com/","https://player.vimeo.com/"];
async function showMedia(el){
  let focus=mediaFocus;mediaFocus=null;
  const live=()=>el.isConnected&&document.querySelector('[data-v="media"].on');
  el.innerHTML='<h2>Media</h2><div class=gcourses aria-busy=true>'+'<div class="gcourse sk" style="height:72px" aria-hidden=true></div>'.repeat(3)+"</div>";
  const data=await api("/materials");
  if(!live())return;
  const safe=u=>/^https?:\/\//i.test(u)?u:"#";
  const item=(m)=>`<article class="mitem" data-m="${m.id}"><div class=mrow>
      <svg class="ico mico" aria-hidden="true" focusable="false"><use href="icons/sprite.svg?v=6#${m.embed?"i-play":"i-link"}"/></svg>
      <div class=mbody><b>${esc(m.title)}</b><small>${esc(m.host)}${m.author?" &middot; "+esc(m.author):""} &middot; ${esc(m.created_at)}</small>${m.description?`<p>${esc(m.description)}</p>`:""}</div>
      <div class="row mact">${m.embed?`<button type=button data-play="${m.id}" aria-expanded=false>Play</button>`:""}<a class=btnlink href="${esc(safe(m.url))}" target=_blank rel="noopener noreferrer">Open<span class=sr-only> ${esc(m.title)} in a new tab</span></a>${m.can_delete?`<button type=button data-del="${m.id}">Remove</button>`:""}</div></div>
      <div class=mplayer></div></article>`;
  const section=c=>`<section class=mcourse data-c="${c.id}"><div class=mhead><h3>${esc(c.title)} <span class=badge>${esc(c.code)}</span></h3>
      <small>${esc(c.teacher)} &middot; ${c.materials.length} material${c.materials.length===1?"":"s"}</small></div>
      <div class=mlist>${c.materials.map(item).join("")||`<p class=mempty>No materials have been attached to this course yet.</p>`}</div>
      ${data.can_edit?`<details class=madd><summary>Add material</summary><form class="lab" data-add="${c.id}">
        <label class=f style="flex:1 1 200px">Title<input name=title required maxlength=120 placeholder="Lecture 1: Introduction"></label>
        <label class=f style="flex:2 1 300px">Link<input name=url type=url required maxlength=500 placeholder="https://www.youtube.com/watch?v=..."></label>
        <label class=f style="flex:1 1 100%">Description (optional)<input name=description maxlength=500></label>
        <button type=submit>Add material</button></form></details>`:""}</section>`;
  let drawn=false;
  const draw=()=>{
    if(drawn)el.dataset.redraw="1";drawn=true;   // later redraws (add / remove) skip the page-enter animation
    const list=focus?data.courses.filter(c=>c.id===focus):data.courses;
    const one=focus&&list[0];
    el.innerHTML=(one?`<div class=mbar><button type=button id=mback>&larr; My courses</button><button type=button id=mall>All courses</button></div><h2>${esc(one.title)}</h2>`:"<h2>Media</h2>")+
      '<div class=msg id=note role=status></div>'+(list.map(section).join("")||"<p>No courses yet.</p>");
    if(one){$("#mback").onclick=()=>show("courses");$("#mall").onclick=()=>{focus=null;draw()}}
    el.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{
      const box=b.closest(".mitem").querySelector(".mplayer"),m=findMaterial(b.dataset.play);
      if(box.firstChild){box.replaceChildren();box.classList.remove("open");b.textContent="Play";b.setAttribute("aria-expanded","false");return}
      if(!m||!PLAYER_HOSTS.some(h=>String(m.embed).startsWith(h)))return;
      const f=document.createElement("iframe");f.src=m.embed;f.title=m.title;f.loading="lazy";f.allowFullscreen=true;
      f.allow="fullscreen; picture-in-picture; encrypted-media";f.referrerPolicy="strict-origin-when-cross-origin";
      f.setAttribute("sandbox","allow-scripts allow-same-origin allow-presentation allow-popups");
      box.append(f);box.classList.add("open");b.textContent="Close player";b.setAttribute("aria-expanded","true");
    });
    el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Remove this material from the course?"))return;
      try{await api("/materials/"+b.dataset.del,{method:"DELETE"});
        data.courses.forEach(c=>c.materials=c.materials.filter(m=>String(m.id)!==b.dataset.del));draw();note(true,"Material removed")}
      catch(er){note(false,er.message)}});
    el.querySelectorAll("form[data-add]").forEach(f=>f.onsubmit=async e=>{
      e.preventDefault();const id=Number(f.dataset.add),fd=new FormData(f);
      try{const m=await api("/materials",{method:"POST",body:JSON.stringify({course_id:id,title:fd.get("title"),url:fd.get("url"),description:fd.get("description")})});
        data.courses.find(c=>c.id===id).materials.unshift(m);draw();note(true,"Material added");ping()}
      catch(er){note(false,er.message)}});
  };
  const findMaterial=id=>{for(const c of data.courses){const m=c.materials.find(x=>String(x.id)===String(id));if(m)return m}return null};
  draw();
}

// ---- Grades: student = small dashboard (average, latest grades with changes, per-course breakdown);
//      teacher = gradebook (pick course + task, give / change / remove grades)
const num=n=>String(Math.round(Number(n)*100)/100);
const pctClass=p=>p>=85?"hi":p>=60?"mid":"low";
async function showGrades(el,t){
  const live=()=>el.isConnected&&document.querySelector('[data-v="grades"].on');
  if(!t){
    el.innerHTML='<h2>Grades</h2><div class=cards aria-busy=true>'+'<div class="card sk" aria-hidden=true><div class=top></div><div class=strip></div></div>'.repeat(3)+"</div>";
    const d=await api("/grades/details");
    if(!live())return;
    const chip=x=>x.previous_score!=null&&x.previous_score!==x.score
      ?`<span class="gchg ${x.score>=x.previous_score?"up":"down"}">${x.score>=x.previous_score?"&#9650;":"&#9660;"} Changed, was ${num(x.previous_score)}/${num(x.max_score)}</span>`:"";
    const feed=x=>{const p=Math.round(100*x.score/x.max_score);
      return `<article class="gitem"><div class="gscore ${pctClass(p)}" aria-label="${num(x.score)} out of ${num(x.max_score)}"><b>${num(x.score)}</b><span>/${num(x.max_score)}</span></div>
        <div class=gbody><div><b>${esc(x.assignment)}</b> <span class=badge>${esc(x.type)}</span> ${chip(x)}</div>
        <small>${esc(x.course)} &middot; ${esc(x.graded_at)}${x.graded_by?" &middot; "+esc(x.graded_by):""}</small>
        ${x.comment?`<p class=gcomment>${esc(x.comment)}</p>`:""}</div></article>`};
    const course=c=>`<details class=gcourse><summary><span class=gname>${esc(c.course)}</span>
        <span class=gsum>${c.percent===null?"No grades yet":num(c.score)+"/"+num(c.max_score)+" &middot; "+num(c.percent)+"%"}</span>${c.percent===null?"":bar(Math.round(c.percent))}</summary>
        ${c.items.length?`<table><tr><th>Task</th><th>Type</th><th>Score</th><th>Graded</th></tr>${c.items.map(x=>`<tr><td><b>${esc(x.assignment)}</b>${chip(x)?"<br>"+chip(x):""}</td><td>${esc(x.type)}</td><td>${num(x.score)}/${num(x.max_score)}</td><td>${esc(x.graded_at)}</td></tr>`).join("")}</table>`:"<p><small>Nothing has been graded in this course yet.</small></p>"}</details>`;
    el.innerHTML="<h2>Grades</h2><div class=cards>"+
      card(`<div class=big>${d.average===null?"&ndash;":d.average+"%"}</div>`,"Average grade")+
      card(`<div class=big>${d.graded}</div>`,"Graded tasks")+
      card(`<div class=big>${d.courses.length}</div>`,"Courses")+"</div>"+
      `<h2 style="margin-top:36px">Recent grades</h2><div class=gfeed>${d.recent.map(feed).join("")||"<p>No grades yet.</p>"}</div>`+
      `<h2 style="margin-top:36px">By course</h2><div class=gcourses>${d.courses.map(course).join("")||"<p>No courses.</p>"}</div>`;
    return;
  }
  const courses=await api("/courses");
  if(!live())return;
  if(!courses.length){el.innerHTML="<h2>Grades</h2><p>You have no courses yet.</p>";return}
  const want=gradeFocus;gradeFocus=null;let wantTask=want&&want.task;
  el.innerHTML=`<h2>Grades</h2><form class=lab id=gf><label class=f>Course<select id=gcs>${opts(courses,"id",x=>x.title)}</select></label>
    <label class=f>Task<select id=gts></select></label></form><div class=msg id=note role=status></div><div id=gtable></div>`;
  $("#gf").onsubmit=e=>e.preventDefault();
  if(want&&courses.some(c=>c.id===want.course))$("#gcs").value=want.course;
  let book=null;
  const task=()=>book.assignments.find(a=>String(a.id)===$("#gts").value);
  const draw=()=>{
    const a=task();
    if(!a){$("#gtable").innerHTML="<p>This course has no tasks yet. Add one under Assignments.</p>";return}
    const byUser={};book.grades.filter(g=>g.assignment_id===a.id).forEach(g=>byUser[g.user_id]=g);
    const subBy={};(book.submissions||[]).forEach(s=>{if(s.assignment_id===a.id)subBy[s.user_id]=s});
    $("#gtable").innerHTML=`<table><tr><th>Student</th><th>Work (link)</th><th>Score (max ${num(a.max_score)})</th><th>Comment</th><th></th></tr>`+
      (book.students.map(s=>{const g=byUser[s.id],sb=subBy[s.id];
        const work=sb?`<a class=btnlink href="${esc(/^https?:\/\//i.test(sb.url)?sb.url:"#")}" target=_blank rel="noopener noreferrer">Open work<span class=sr-only> of ${esc(s.name)}</span></a>
          <br><small>${esc(sb.submitted_at)}${sb.late?' <span class="badge od">Late</span>':""}</small>${sb.comment?`<br><small class=gcomment>${esc(sb.comment)}</small>`:""}`:"<small>Not submitted</small>";
        return `<tr data-u="${s.id}"><td><b>${esc(s.name)}</b><br><small>${esc(s.email)}</small></td>
          <td>${work}</td>
          <td><input class=gin type=number step=any min=0 max=${a.max_score} value="${g?num(g.score):""}" aria-label="Score for ${esc(s.name)}" style="width:96px">
            <br><small>${g?`Graded ${esc(g.graded_at)}${g.changed?" &middot; changed":""}`:"Not graded"}</small></td>
          <td><input class=gcm maxlength=300 value="${esc(g?g.comment:"")}" placeholder="Comment (optional)" aria-label="Comment for ${esc(s.name)}"></td>
          <td><div class=row><button data-save="${s.id}">Save</button>${g?`<button data-del="${g.id}">Remove</button>`:""}</div></td></tr>`}).join("")||"<tr><td colspan=5>No students are enrolled.</td></tr>")+"</table>";
    $("#gtable").querySelectorAll("tr[data-u]").forEach(tr=>{
      const uid=Number(tr.dataset.u),save=()=>saveRow(tr,uid);
      tr.querySelector("[data-save]").onclick=save;
      tr.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")save()}));
      const del=tr.querySelector("[data-del]");
      if(del)del.onclick=async()=>{if(!confirm("Remove this grade? The student will no longer see it."))return;
        try{await api("/grades/"+del.dataset.del,{method:"DELETE"});book.grades=book.grades.filter(g=>String(g.id)!==del.dataset.del);draw();note(true,"Grade removed")}catch(er){note(false,er.message)}};
    });
  };
  const saveRow=async(tr,uid)=>{
    const a=task(),raw=tr.querySelector(".gin").value.trim();
    if(raw===""){note(false,"Enter a score first");return}
    try{
      const r=await api("/grades",{method:"PUT",body:JSON.stringify({assignment_id:a.id,user_id:uid,score:raw,comment:tr.querySelector(".gcm").value})});
      const old=book.grades.find(g=>g.assignment_id===a.id&&g.user_id===uid);
      book.grades=book.grades.filter(g=>g!==old);
      book.grades.push({id:r.grade.id,user_id:uid,assignment_id:a.id,score:r.grade.score,comment:r.grade.comment,graded_at:r.grade.graded_at,changed:!!(old&&(old.changed||r.changed))});
      draw();
      const s=book.students.find(x=>x.id===uid);note(true,r.changed?`Saved: ${s.name} - ${num(r.grade.score)}/${num(a.max_score)}`:"No changes to save");ping();
    }catch(er){note(false,er.message)}
  };
  const loadCourse=async()=>{
    $("#gtable").innerHTML="<p>Loading…</p>";
    try{book=await api(`/courses/${$("#gcs").value}/grades`)}catch(er){$("#gtable").innerHTML="<p class=msg>"+esc(er.message)+"</p>";return}
    if(!live())return;
    $("#gts").innerHTML=book.assignments.map(a=>`<option value=${a.id}>${esc(a.title)} (${esc(a.type)}, max ${num(a.max_score)})</option>`).join("");
    if(wantTask){if(book.assignments.some(a=>a.id===wantTask))$("#gts").value=wantTask;wantTask=null}
    draw();
  };
  $("#gcs").onchange=loadCourse;$("#gts").onchange=draw;
  await loadCourse();
}

    return;
  }
  // runs a teacher action, redraws the page and shows the result message
  const act=async(fn,okMsg)=>{try{await fn();await show(v);note(true,okMsg);ping()}catch(er){note(false,er.message)}};
  const post=(path,body)=>api(path,{method:"POST",body:JSON.stringify(body)});
  const del=path=>api(path,{method:"DELETE"});
  try{
  if(v==="courses"){

      const go=()=>{mediaFocus=x.id;show("media")};

  }else if(v==="dashboard"){
    const [d,all,att]=await Promise.all([api("/dashboard"),api("/assignments"),t?Promise.resolve([]):api("/attendance")]);
    const todo=all.filter(x=>x.score===null);   // not graded yet = still to do (for a teacher: every task)
    const ctl={current:"Current",midterm:"Midterm",final:"Final"};
    const ico='<svg class="ico tl-ico" aria-hidden="true" focusable="false"><use href="icons/sprite.svg?v=6#i-notes"/></svg>';
    const day=s=>{const t=new Date(s+"T00:00:00Z"),o={timeZone:"UTC"};
      return t.toLocaleDateString("en-US",{...o,weekday:"long"})+", "+t.getUTCDate()+" "+t.toLocaleDateString("en-US",{...o,month:"long"})+" "+t.getUTCFullYear()};
    const cards=t?card(`<div class=big>${d.courses}</div>`,"Courses")+card(`<div class=big>${d.students}</div>`,"Students")+

      :card(`<div class=big>${d.courses}</div>`,"Courses")+card(`<div class=big>${d.avg_grade}%</div>`,"Average grade")+
        card(`<div class=big>${d.groups}</div>`,"Project groups");
    const attTable=t?"":`<h2 style="margin-top:36px">Attendance by course</h2>
      <table><tr><th>Course</th><th>Present</th><th>%</th><th></th></tr>`+

    el.innerHTML="<h2>Dashboard</h2><div class=cards>"+cards+"</div>"+

      <input id=tq placeholder="Search by activity type or name" aria-label="Search"></div>

      let list=todo.filter(x=>(f==="all"||(f==="overdue")===x.overdue)&&

      if(byCourse)list.sort((a,b)=>a.course.localeCompare(b.course)||(a.due_date+a.due_time).localeCompare(b.due_date+b.due_time));

  }else if(v==="schedule"){

    const form="";/* schedule changes are available only in the administrator panel */const legacyTeacherForm=!t?"":`<form id=sf class=lab>
      <label class=f>Course<select id=sc required>${opts(c,"id",x=>x.title)}</select></label>

      <label class=f>Start<input id=ss type=time value=09:00 required></label>
      <label class=f>End<input id=se type=time value=10:30 required></label>
      <label class=f>Room<input id=sr maxlength=20 placeholder="C1.101" required style="width:110px"></label>

    const today=new Date().toLocaleDateString("sv-SE");   // local YYYY-MM-DD for the date picker

  showRecovery(`<h1>Set a new password</h1><p>Step 3 of 4 · Choose a new password</p><form id="new-password-form"><label for="new-password">New password</label><div class="pw-row"><input id="new-password" type="password" autocomplete="new-password" required aria-describedby="password-hint"><button type="button" class="toggle-password" data-target="new-password">Show</button></div><span id="password-hint" class="hint">Use at least 8 characters, including a letter and a number.</span><div class="strength" aria-label="Password strength"><span id="strength-bar"></span></div><ul class="checklist"><li id="rule-length">At least 8 characters</li><li id="rule-letter">Contains a letter</li><li id="rule-number">Contains a number</li></ul><label for="confirm-password">Confirm new password</label><div class="pw-row"><input id="confirm-password" type="password" autocomplete="new-password" required><button type="button" class="toggle-password" data-target="confirm-password">Show</button></div><p id="recovery-error" class="msg" aria-live="polite"></p><button class="ms" type="submit">Change password</button></form>`,"#new-password");
  recoveryPanel.querySelectorAll('.toggle-password').forEach(b=>b.onclick=()=>{const input=$("#"+b.dataset.target);input.type=input.type==="password"?"text":"password";b.textContent=input.type==="password"?"Show":"Hide"});
  $("#new-password").oninput=()=>{const v=$("#new-password").value,letter=/[A-Za-z]/.test(v),number=/[0-9]/.test(v),length=v.length>=8;[["rule-length",length],["rule-letter",letter],["rule-number",number]].forEach(([id,ok])=>{$("#"+id).textContent=(ok?"✓ ":"• ")+$("#"+id).textContent.replace(/^[✓•] /,"")});const score=Number(length)+Number(letter)+Number(number),bar=$("#strength-bar");bar.style.width=(score*33.33)+"%";bar.style.background=score===3?"#16833c":score===2?"#c18a00":"#b44"};
  $("#new-password-form").onsubmit=async e=>{e.preventDefault();const pw=$("#new-password").value,confirm=$("#confirm-password").value;if(pw!==confirm){$("#recovery-error").textContent="The passwords do not match. Enter them again.";$("#confirm-password").focus();return}if(pw.length<8||!/[A-Za-z]/.test(pw)||!/[0-9]/.test(pw)||new TextEncoder().encode(pw).length>72){$("#recovery-error").textContent="Use at least 8 characters, including a letter and a number.";$("#new-password").focus();return}const b=e.currentTarget.querySelector('button[type="submit"]');b.disabled=true;try{await api("/recover/reset",{method:"POST",body:JSON.stringify({token:recoveryToken,password:pw,confirm_password:confirm})});recoveryToken="";recoverySuccessView()}catch(err){$("#recovery-error").textContent=networkMessage(err);b.disabled=false}};
}
function recoverySuccessView(){showRecovery(`<h1>Password changed</h1><p>Your password has been updated. For your security, you will need to sign in again on other devices.</p><button class="ms" id="recovery-signin" type="button">Sign in</button>`,"#recovery-signin");$("#recovery-signin").onclick=hideRecovery}
$("#forgot-password").onclick=e=>{e.preventDefault();recoveryRequestView($("#email").value.trim())};
const recoveryTokenFromUrl=new URLSearchParams(location.search).get("recover_token");
if(recoveryTokenFromUrl)beginPasswordReset(recoveryTokenFromUrl);else if(token)start();

</script>
